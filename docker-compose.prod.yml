# FinSight360 — production stack (one server).
#   PostgreSQL (private, never exposed) + the app + Caddy (automatic HTTPS) + daily backups.
# Start / update:  docker compose -f docker-compose.prod.yml up -d --build
# Settings come from .env in this folder (create it with: sh deploy/make-env.sh your.domain).
name: finsight360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: finsight360
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight360"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    image: finsight360-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finsight:${POSTGRES_PASSWORD}@db:5432/finsight360?schema=public
      STORAGE_DIR: /app/storage
      TRUST_PROXY: "true"
      AUTH_TRUST_HOST: "true"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
