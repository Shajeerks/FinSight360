<title>Offline · FinSight360</title>
<style>

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .icon { width: 48px; height: 48px; border-radius: 999px; background: var(--tint); color: var(--primary); display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  a { color: var(--primary); font-weight: 600; font-size: 14px; }
